/* Log-space models, VIX1D-driven. Refit Aug 2026 on 1,030 non-FOMC sessions

   flagged for skipping in the UI, so there is no event dummy anywhere.
   M_932 is fitted on the 816 live-VIX1D sessions only: before 2023-04-03 Cboe

   not an open in that era and measurably degraded the coefficient.
   Each model has a _NOPRE twin used when the feed returns no premarket bars.
   MAE figures are walk-forward (expanding window, refit every 21 sessions). */
// ln(range) = a + b*ln(premkt) + c*ln(vix1dPrevClose)
/* ---------- 2. THE MODEL --------------------------------------------------
   DO NOT EDIT THESE CONSTANTS WITHOUT RE-RUNNING THE FIT.

   Log space throughout: ln(range) = a + SUM b_i * ln(x_i). Fitted by OLS on
   1,030 non-Fed SPY sessions, May 2022 - Aug 2026. Fed decision days are
   excluded from every fit and flagged for skipping, so there is no event
   dummy anywhere in here.

   M_932 is fitted on the 816 live-VIX1D sessions only: before 2023-04-03 Cboe
   published one value per day (OPEN=HIGH=LOW=CLOSE), so "today's open" was not
   an open in that era and measurably degraded the coefficient.

   Each model has a _NOPRE twin used when the feed returns no premarket bars.
   MAE figures are walk-forward (expanding window, refit every 21 sessions).
   -------------------------------------------------------------------------- */

/* ---------- CALENDAR CORRECTIONS (added 2026-09-02) -----------------------
   Multiplicative factors on the estimate. Each began as a residual bias on the
   1,032 non-Fed sessions and was then tested WALK-FORWARD before shipping:
   factor estimated on years before the test year, applied to the test year,
   test years 2024-2026 (634 sessions). The shipped constants above are
   untouched; these sit on top of them.

   GAP - the session after a weekend or holiday. VIX1D's previous close was
   set on a Friday and prices a three-calendar-day window; fed in unadjusted,
   the pre-open model over-forecasts those sessions by ~9% (t = -3.8). Out of
   sample the factor takes the gap-day bias from 0.932 to 1.028 at pre-open and
   0.949 to 1.025 at 10:30, with exact-band accuracy up 1.8 and 1.3 points.
   The 9:32 model already holds today's VIX1D open and needs no factor - a
   factor there made it worse - and by 11:00 the checkpoints have seen the
   quiet morning, so the effect fades below what the rule will ship.

   MONTH_END - the last session of a calendar month. Rebalancing flow expands
   the last hour: it adds 21% to the range against 8% on other days, 28% on
   quarter-ends. Every stage from 10:30 on under-forecasts by 14-18% (t = 2.8
   to 4.5). Out of sample the factors cut that to 5-8% with lower error at
   every stage. 14:00 and 15:00 are included on the strength of lower sd, MAE
   and bias; they missed the stricter halving criterion applied to the rest
   only because the effect has grown year on year, so a trailing estimate
   under-corrects. Quarter-ends are inside this flag and run ~25%; no separate
   factor at n = 17. Not applied to pre-open or 9:32 (t = 2.2 and 1.5).

   NOT SHIPPED. A concave VIX1D term for the 9:32 model was investigated and
   found to be an analysis error: on the 816 live sessions the model is fitted
   on, the 9:32 estimate is flat across VIX1D quintiles (0.97-1.05).

   The month-end flag uses the calendar (no later weekday in the same month);
   a month whose last weekday is a market holiday will flag the holiday and
   miss the true last session. Rare, and it errs by not applying. */
const GAP_ADJ = {
  preopen: 0.91,
  630: 0.93
};
const MONTH_END_ADJ = {
  630: 1.15,
  660: 1.18,
  690: 1.18,
  720: 1.18,
  780: 1.14,
  840: 1.13,
  900: 1.12
};
function isMonthEndSession(dateStr) {
  if (!dateStr) return false;
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  do {
    dt.setUTCDate(dt.getUTCDate() + 1);
  } while (dt.getUTCDay() === 0 || dt.getUTCDay() === 6);
  return dt.getUTCMonth() !== m - 1;
}
function isGapSession(curDate, priorDate) {
  if (curDate && priorDate) {
    return Date.parse(curDate + "T00:00:00Z") - Date.parse(priorDate + "T00:00:00Z") > 1.5 * 86400000;
  }
  if (!curDate) return false;
  return new Date(curDate + "T12:00:00Z").getUTCDay() === 1; // no prior session known: Monday is the best guess
}

const F_PREOPEN = {

  b: 0.32437,
  c: 0.38103,
  sdLog: 0.39348,
  mae: 0.34
};

  b: 0.10312,
  c: 0.13346,
  d: 0.62937,
  sdLog: 0.31205,
  mae: 0.28
};

   live-VIX1D sessions, fully out-of-sample strike selection:
     revision < 0.90 -> the 90% strike row held 83.1% (25% of sessions)
     otherwise       -> held 91.1%
   Gone by 13:00 (p=0.57), so the flag only arms in the morning. */
const REVISION_CUT = 0.90;
const REVISION_LAST_CHK = 720; // 12:00 - no measurable effect after this
/* ---------- ENTRY SCHEDULE, BOTH STRUCTURES -------------------------------
   Two structures, both shippable, both measured on the same run. The app shows
   one at a time; the toggle above the table picks which, and the choice is
   stored under rangedesk:struct.

     IRON CONDOR   a call vertical sold $1 above spot and a put vertical sold
                   $1 below it, each $5 wide, each leg stopped independently
                   when SPY trades $1 through its own short strike.
     CALL SPREAD   the call half of that, alone. Same offset, same width,
                   same stop.

   The two tables differ ONLY in the structure traded. Same sessions, same
   credit surface, same fills, same first-match slot rule, same $1 stop - so
   the rows can be compared line for line.

   REFIT 2026-09-01. Every figure below is measured on the same run: all 816
   non-Fed live-VIX1D sessions (2023-04-03 - 2026-08-12), credit and cost-to-close
   both priced from an empirical credit surface, natural fills throughout (sell
   the bid, pay the ask, both on entry and on exit).

   The surface replaces the old IV = 0.78 x VIX1D assumption, which prices a
   $5-wide vertical at 0.44-0.45x of real quotes - it understates ATM IV by
   roughly 1.7x. The surface is read from 1.5M real verticals across 80 quote
   sessions in dimensionless (moneyness, width) space; held-out validation gives
   MAE $15 and ratio 0.995x. Exit prices were checked against 1,858 real stop
   events: accurate to $2-3 at a one-minute reaction lag.

   WHAT CHANGED, AND WHY IT IS NOT WHAT §8.3 PREDICTED. The synthesis reports the
   app's credits as 40-58% too LOW, from 57 real-quote sessions. Those sessions
   are not representative of their bands: within WILD their median VIX1D open is
   22.4 against 13.8 for the rest of the band, and within AGITATED 14.9 against
   12.1. Measured across the whole era instead, CALM and NORMAL were about right
   and AGITATED and WILD were too HIGH. Do not restore the old numbers.

   ROWS ARE CONDITIONAL ON REACHING THAT SLOT UNTRADED. Bands are re-estimated at
   every checkpoint, so a session can qualify at more than one slot. The rule is
   first match wins: at 10:30 trade if the band reads CALM, else wait; at 11:30
   trade if it reads NORMAL, else wait; and so on. 166 of 816 sessions never
   match a slot and are not traded. The n column counts sessions that reached
   that slot untraded AND matched it, so the four rows sum to the portfolio.

   Principle: the more volatile the forecast, the later the entry. Higher bands
   need more of the day burned off before the credit covers the risk. Entering
   AGITATED at 11:00 instead of 12:30 drops the win rate from 68% to 59%.

   PORTFOLIO under that rule, one contract, no compounding:
     condor       650 trades, 58.8% win, +$13.35/trade (t = 5.11), +$8,677,
                  max DD -$628, ~193/yr. 2023 +$1,682, 2024 +$884,
                  2025 +$3,288, 2026 +$2,823 (to 12 Aug).
     call spread  688 trades, 80.4% win, +$10.14/trade (t = 4.90), +$6,978,
                  max DD -$411, ~205/yr. 2023 +$929, 2024 +$1,157,
                  2025 +$2,975, 2026 +$1,917.
   Neither has a losing year. The condor trades 38 fewer sessions because a
   stopped put side can leave a session unprofitable where the call alone was
   flat; both counts come from the same 816.

   WHICH TO TRADE. Paired on the 650 sessions where both trade, the condor
   earns +$4.56/trade more, t = 1.99, better on 468 of 650. That is the entire
   case for it, and it is thin:
   - An earlier run reported +$9.15 and t = 4.05; that run assigned each
     session to the LAST slot its band matched, which needs lookahead. First
     match is the implementable rule and it roughly halves the edge. Do not
     quote the old figure.
   - Two extra legs cost roughly $1.60/trade more in commission at $0.65/leg,
     taking the net edge to about $2.90.
   - The win rate drops from 80% to 59%. Half of all AGITATED and WILD condors
     lose. That is a very different thing to sit through, and it is the main
